name: Build DogeOS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dogeos_version:
        description: DogeOS version
        required: true
        default: "0.1"
      ubuntu_release:
        description: Ubuntu release
        required: true
        default: "26.04"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/az || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Build ISO
        env:
          DOGEOS_VERSION: ${{ inputs.dogeos_version || '0.1' }}
          UBUNTU_RELEASE: ${{ inputs.ubuntu_release || '26.04' }}
        run: |
          set +e
          sudo -E bash ./build-dogeos.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          df -h | tee -a build.log
          exit "$status"

      - name: Verify build outputs
        env:
          DOGEOS_VERSION: ${{ inputs.dogeos_version || '0.1' }}
        run: |
          ls -lh dist
          test -s "dist/DogeOS-${DOGEOS_VERSION}-amd64.iso"
          test -s "dist/DogeOS-${DOGEOS_VERSION}-amd64.sha256"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DogeOS-${{ inputs.dogeos_version || '0.1' }}-amd64
          path: dist/
          if-no-files-found: error
          compression-level: 0

      - name: Save failure log
        if: failure()
        run: |
          if [ -f build.log ]; then
            tail -n 300 build.log > .github/last-build.log
          else
            echo "build.log was not created" > .github/last-build.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-build.log
          git commit -m "Record build failure log [skip ci]" || exit 0
          git push
